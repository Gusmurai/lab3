<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Добавление человека</title>
</head>
<body class="container mt-4 mb-5">
<h2 th:text="${personDto.id == null} ? 'Добавление человека' : 'Редактирование человека'"></h2>

<form th:action="@{/persons/new}" th:object="${personDto}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <div class="mb-3">
        <label>Фамилия:</label>
        <input type="text" class="form-control" th:field="*{lastName}">
        <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
    </div>

    <div class="mb-3">
        <label>Имя:</label>
        <input type="text" class="form-control" th:field="*{firstName}">
        <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
    </div>

    <div class="mb-3">
        <label>Отчество:</label>
        <input type="text" class="form-control" th:field="*{middleName}">
        <div class="text-danger" th:if="${#fields.hasErrors('middleName')}" th:errors="*{middleName}"></div>
    </div>

    <div class="mb-3">
        <label>Пол:</label>
        <select class="form-select" th:field="*{gender}">
            <option value="Мужской">Мужской</option>
            <option value="Женский">Женский</option>
        </select>
        <div class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
    </div>

    <div class="mb-3">
        <label>Рост (см):</label>
        <input type="number" class="form-control" th:field="*{height}">
        <div class="text-danger" th:if="${#fields.hasErrors('height')}" th:errors="*{height}"></div>
    </div>

    <div class="mb-3">
        <label>Вес (кг):</label>
        <input type="number" step="0.1" class="form-control" th:field="*{weight}">
        <div class="text-danger" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></div>
    </div>

    <div class="mb-3">
        <label>Дата рождения:</label>
        <input type="date" class="form-control" th:field="*{birthDate}">
        <div class="text-danger" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
    </div>

    <div class="mb-3">
        <label>Номер телефона:</label>
        <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="+7XXXXXXXXXX">
        <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
    </div>


    <div class="mb-3">
        <label>Национальность:</label>
        <select class="form-select" th:field="*{nationalityId}">
            <option th:each="n : ${nationalities}" th:value="${n.id}" th:text="${n.name}"></option>
        </select>
        <div class="text-danger" th:if="${#fields.hasErrors('nationalityId')}" th:errors="*{nationalityId}"></div>
    </div>

    <div class="mb-3">
        <label>Адрес (Город, Улица, Дом):</label>
        <select class="form-select" th:field="*{addressId}">
            <option th:each="a : ${addresses}" th:value="${a.id}" th:text="${a.fullAddress}"></option>
        </select>
        <div class="text-danger" th:if="${#fields.hasErrors('addressId')}" th:errors="*{addressId}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/persons" class="btn btn-secondary">Отмена</a>
</form>
</body>
</html>

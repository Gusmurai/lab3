<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="container mt-4">
<h2>Люди</h2>

<form action="/persons/search" method="post" class="d-flex mb-3">
    <select name="criteria" class="form-select me-2" style="width: auto;">
        <option value="lastName">Фамилия</option>
        <option value="city">Город</option>
        <option value="nationality">Национальность</option>
    </select>
    <input type="text" name="query" class="form-control me-2" placeholder="Поиск...">
    <button type="submit" class="btn btn-primary">Найти</button>
    <a href="/persons" class="btn btn-secondary ms-2">Сбросить</a>
</form>

<a href="/persons/new" class="btn btn-success mb-3">Добавить</a>
<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>Фамилия</th>
        <th>Имя</th>
        <th>Национальность</th>
        <th>Город</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${persons}">
        <td th:text="${p.lastName}"></td>
        <td th:text="${p.firstName}"></td>
        <td th:text="${p.nationality.name}"></td>
        <td th:text="${p.address.city}"></td>
        <td>
            <a class="btn btn-warning btn-sm" th:href="@{'/persons/update/' + ${p.id}}">Изменить</a>
            <a class="btn btn-danger btn-sm" th:href="@{'/persons/delete/' + ${p.id}}">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
